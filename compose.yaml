name: ${COMPOSE_PROJECT_NAME:-sovereign-ai-single-node}

x-runtime-build: &runtime-build
  context: .
  dockerfile: Dockerfile

x-runtime-environment: &runtime-environment
  DEPLOYMENT_DATABASE_HOST: database
  DEPLOYMENT_DATABASE_PORT: "5432"
  DEPLOYMENT_DATABASE_NAME: sovereign_ai
  DEPLOYMENT_DATABASE_USER: sovereign_app
  DEPLOYMENT_DATABASE_PASSWORD_FILE: /run/secrets/database_password
  DEPLOYMENT_OLLAMA_URL: http://inference:11434
  DEPLOYMENT_OLLAMA_VERSION: ${DEPLOYMENT_OLLAMA_VERSION:-0.32.5}
  DEPLOYMENT_MODEL_ID: ${DEPLOYMENT_MODEL_ID:-qwen3:4b}
  DEPLOYMENT_MODEL_DIGEST: ${DEPLOYMENT_MODEL_DIGEST:-sha256:359d7dd4bcdab3d86b87d73ac27966f4dbb9f5efdfcc75d34a8764a09474fae7}
  DEPLOYMENT_MODEL_CONTEXT_WINDOW: ${DEPLOYMENT_MODEL_CONTEXT_WINDOW:-8192}
  DEPLOYMENT_MODEL_LOAD_TIMEOUT_MS: "600000"
  DEPLOYMENT_ATTACHMENT_ROOT: /var/lib/sovereign/attachments
  DEPLOYMENT_SPOOL_ROOT: /var/lib/sovereign/spool
  DEPLOYMENT_SPOOL_KEY_FILE: /run/secrets/spool_key
  DEPLOYMENT_SPOOL_MAX_ENTRIES: "10000"
  DEPLOYMENT_SPOOL_MAX_BYTES: "536870912"

x-security: &security
  security_opt:
    - no-new-privileges:true

services:
  server:
    image: ${SOVEREIGN_RUNTIME_IMAGE:-sovereign-ai-runtime:0.4.0-c4}
    build: *runtime-build
    command: ["node", "scripts/serve.ts"]
    <<: *security
    environment:
      <<: *runtime-environment
      HARNESS_LOCAL_PROVIDERS: /opt/sovereign/deployment/local-providers.json
      DEPLOYMENT_ID: ${DEPLOYMENT_ID:-single-node}
      DEPLOYMENT_SERVER_HOST: 0.0.0.0
      DEPLOYMENT_SERVER_PORT: "8080"
      DEPLOYMENT_SESSION_REGISTRY_FILE: /run/secrets/session_registry
      DEPLOYMENT_RUN_TIMEOUT_MS: ${DEPLOYMENT_RUN_TIMEOUT_MS:-600000}
      DEPLOYMENT_CONTROL_LEASE_TTL_MS: ${DEPLOYMENT_CONTROL_LEASE_TTL_MS:-660000}
      DEPLOYMENT_MAX_CONCURRENT_RUNS_PER_USER: ${DEPLOYMENT_MAX_CONCURRENT_RUNS_PER_USER:-1}
      DEPLOYMENT_MAX_CONCURRENT_RUNS_PER_MODEL: ${DEPLOYMENT_MAX_CONCURRENT_RUNS_PER_MODEL:-1}
      DEPLOYMENT_MAX_RUNS_PER_USER_PER_WINDOW: ${DEPLOYMENT_MAX_RUNS_PER_USER_PER_WINDOW:-60}
      DEPLOYMENT_RATE_WINDOW_MS: ${DEPLOYMENT_RATE_WINDOW_MS:-3600000}
      DEPLOYMENT_MAX_TOKENS_PER_USER_PER_WINDOW: ${DEPLOYMENT_MAX_TOKENS_PER_USER_PER_WINDOW:-1000000}
      DEPLOYMENT_MAX_SPEND_USD_PER_USER_PER_WINDOW: ${DEPLOYMENT_MAX_SPEND_USD_PER_USER_PER_WINDOW:-0}
      DEPLOYMENT_BUDGET_WINDOW_MS: ${DEPLOYMENT_BUDGET_WINDOW_MS:-86400000}
      DEPLOYMENT_PROJECTION_INTERVAL_MS: "1000"
      DEPLOYMENT_ADMISSION_FREE_BYTES: ${DEPLOYMENT_ADMISSION_FREE_BYTES:?set a current measured available-memory byte count}
      DEPLOYMENT_ADMISSION_HEADROOM_BYTES: ${DEPLOYMENT_ADMISSION_HEADROOM_BYTES:-536870912}
    secrets:
      - database_password
      - spool_key
      - session_registry
    depends_on:
      database:
        condition: service_healthy
      inference:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      volume-init:
        condition: service_completed_successfully
    volumes:
      - attachments:/var/lib/sovereign/attachments
      - event_spool:/var/lib/sovereign/spool
    networks:
      - data_plane
    ports:
      - "127.0.0.1:${SOVEREIGN_INGRESS_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:mode=0700,uid=1000,gid=1000
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 30s

  database:
    image: pgvector/pgvector:0.8.6-pg18-bookworm@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
    <<: *security
    environment:
      POSTGRES_DB: sovereign_ai
      POSTGRES_USER: sovereign_app
      POSTGRES_PASSWORD_FILE: /run/secrets/database_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
    secrets:
      - database_password
    volumes:
      - database_data:/var/lib/postgresql
    networks:
      - data_plane
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sovereign_app -d sovereign_ai -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 60s

  inference:
    image: ollama/ollama:0.32.5@sha256:4dea9fb511947e24a84237bb636b0203abcb2ff0d3fbc7b4ff865deb91362131
    <<: *security
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_CONTEXT_LENGTH: ${DEPLOYMENT_MODEL_CONTEXT_WINDOW:-8192}
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_NO_CLOUD: "1"
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - data_plane
    expose:
      - "11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 60s

  migrate:
    image: ${SOVEREIGN_MIGRATION_IMAGE:-sovereign-ai-migrate:0.1.0-p3.1}
    build:
      context: .
      dockerfile: deployment/Dockerfile.migrate
    <<: *security
    environment:
      DEPLOYMENT_DATABASE_HOST: database
      DEPLOYMENT_DATABASE_PORT: "5432"
      DEPLOYMENT_DATABASE_NAME: sovereign_ai
      DEPLOYMENT_DATABASE_USER: sovereign_app
      DEPLOYMENT_DATABASE_PASSWORD_FILE: /run/secrets/database_password
    secrets:
      - database_password
    depends_on:
      database:
        condition: service_healthy
    networks:
      - data_plane
    read_only: true
    tmpfs:
      - /tmp:mode=0700
    cap_drop:
      - ALL
    restart: "no"

  volume-init:
    image: ${SOVEREIGN_RUNTIME_IMAGE:-sovereign-ai-runtime:0.4.0-c4}
    build: *runtime-build
    user: "0:0"
    command: ["node", "scripts/initialize-deployment-volumes.ts"]
    network_mode: none
    volumes:
      - attachments:/var/lib/sovereign/attachments
      - event_spool:/var/lib/sovereign/spool
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    restart: "no"

  runtime-check:
    image: ${SOVEREIGN_RUNTIME_IMAGE:-sovereign-ai-runtime:0.4.0-c4}
    build: *runtime-build
    <<: *security
    environment: *runtime-environment
    secrets:
      - database_password
      - spool_key
    depends_on:
      database:
        condition: service_healthy
      inference:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      volume-init:
        condition: service_completed_successfully
    volumes:
      - attachments:/var/lib/sovereign/attachments
      - event_spool:/var/lib/sovereign/spool
    networks:
      - data_plane
    read_only: true
    tmpfs:
      - /tmp:mode=0700,uid=1000,gid=1000
    cap_drop:
      - ALL
    profiles:
      - verify
    restart: "no"

  model-bootstrap:
    image: ${SOVEREIGN_BOOTSTRAP_IMAGE:-sovereign-ai-ollama-bootstrap:0.1.0-p3.1}
    build:
      context: .
      dockerfile: deployment/Dockerfile.ollama-bootstrap
    environment:
      OLLAMA_CONTEXT_LENGTH: ${DEPLOYMENT_MODEL_CONTEXT_WINDOW:-8192}
      DEPLOYMENT_MODEL_ID: ${DEPLOYMENT_MODEL_ID:-qwen3:4b}
      DEPLOYMENT_MODEL_DIGEST: ${DEPLOYMENT_MODEL_DIGEST:-sha256:359d7dd4bcdab3d86b87d73ac27966f4dbb9f5efdfcc75d34a8764a09474fae7}
      DEPLOYMENT_OLLAMA_VERSION: ${DEPLOYMENT_OLLAMA_VERSION:-0.32.5}
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - bootstrap_egress
    <<: *security
    profiles:
      - bootstrap
    restart: "no"

  backup:
    image: pgvector/pgvector:0.8.6-pg18-bookworm@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
    entrypoint: ["/bin/bash", "/deployment/backup.sh"]
    user: "${SOVEREIGN_UID:-1000}:${SOVEREIGN_GID:-1000}"
    <<: *security
    environment:
      DEPLOYMENT_DATABASE_HOST: database
      DEPLOYMENT_DATABASE_PORT: "5432"
      DEPLOYMENT_DATABASE_NAME: sovereign_ai
      DEPLOYMENT_DATABASE_USER: sovereign_app
      DEPLOYMENT_DATABASE_PASSWORD_FILE: /run/secrets/database_password
      DEPLOYMENT_BACKUP_ROOT: /backups
    secrets:
      - database_password
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ./deployment/bin/backup.sh:/deployment/backup.sh:ro
      - ./deployment/backups:/backups
    networks:
      - data_plane
    read_only: true
    tmpfs:
      - /tmp:mode=0700,uid=${SOVEREIGN_UID:-1000},gid=${SOVEREIGN_GID:-1000}
    cap_drop:
      - ALL
    profiles:
      - ops
    restart: "no"

networks:
  data_plane:
    internal: true
  bootstrap_egress:

volumes:
  database_data:
  ollama_models:
  attachments:
  event_spool:

secrets:
  database_password:
    file: ./deployment/secrets/database_password
  spool_key:
    file: ./deployment/secrets/spool_key
  session_registry:
    file: ./deployment/secrets/session_registry
